# /etc/nginx/sites-available/luiten-crm
# Daarna: certbot --nginx -d crm.voorbeeld.nl --redirect  (voegt HTTPS + doorsturen van http toe)
server {
    listen 80;
    listen [::]:80;
    server_name crm.voorbeeld.nl;

    server_tokens off;
    # Foto-uploads tot 12 MB (nginx staat standaard maar 1 MB toe)
    client_max_body_size 13m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Nodig voor de inlogcontrole van de app (Origin moet overeenkomen met https://<domein>)
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overschrijven, niet aanvullen: de app vertrouwt precies één proxy
        proxy_set_header X-Forwarded-For   $remote_addr;
        # ZIP-export met foto's kan even duren
        proxy_read_timeout 120s;
    }
}
